[project]
name = "okx-backend"
version = "0.1.0"
description = "OKX 行情连接服务后端（REQ-001）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy[asyncio]>=2.0.52",
    "alembic>=1.20.0",
    "aiomysql>=0.3.2",
    "pymysql>=1.2.0",
    "redis>=8.1.0",
    "pydantic-settings>=2.15.0",
    "python-okx>=0.4.4",
    "websockets>=17.1",
    "httpx>=0.28.1",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "loguru>=0.7.3",
    "python-socks[asyncio]>=3.1.1",
    "nacos-sdk-python>=3.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
okx-backend = "okx_backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "mypy>=2.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults is the standard idiom.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E741"]  # 测试里用物理列名 l 断言，属于必要的白盒细节，不是可读性问题。

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
